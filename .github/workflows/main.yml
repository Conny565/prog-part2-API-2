name: RaceDay Build and Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Display .NET version
        run: dotnet --version

      - name: Restore dependencies
        run: dotnet restore testingPOE.csproj

      - name: Build project
        run: dotnet build testingPOE.csproj --no-restore

      - name: Run unit tests
        run: dotnet test unitTesting.csproj
